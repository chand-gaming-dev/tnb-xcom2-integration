; Optional abilities are looked up at runtime. Missing templates are reported, not hard dependencies.
; Every Ability mapping must document its exact template and source immediately above the row.
; Core-game targets need no Workshop mod. Optional providers must include a direct Workshop URL.
; Provider links identify the source, not a recommendation to add an overhaul just for one perk.
; Optional Full Kit template: FullKit; verified installed LWOTC provider, utility grenades and Battle Scanners only.
