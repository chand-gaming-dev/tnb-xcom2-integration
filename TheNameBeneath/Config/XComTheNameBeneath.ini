+ShippedMappings=(Key="resourceful_full_kit",Context=Character,SourceKind=Trait,SourceID="trait.resourceful",MinVersion=3,MaxVersion=3,EffectKind=Ability,Target=FullKit,WeaponSlot=eInvSlot_Unknown,bEnabled=true,Note="Installed provider: +1 charge per qualifying utility grenade item and Battle Scanner; not medikits or the grenade pocket. Stock-WOTC provider qualification remains open.")
